<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vinicius Alvim</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600&family=Source+Serif+4:wght@400;600&display=swap">
  <style>
    :root { --texto:#231f20; --suave:#55504f; --destaque:#f14b59; --fundo:#f4efe6; --cartao:#fffdf7; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--fundo); color:var(--texto); font-family:"Source Sans 3",system-ui,sans-serif; line-height:1.5; }
    main { max-width:46rem; margin:0 auto; padding:4rem 1.25rem; }
    .selo { color:var(--destaque); font-weight:600; letter-spacing:.14em; text-transform:uppercase; font-size:.85rem; }
    h1 { font-family:"Source Serif 4",Georgia,serif; font-weight:600; font-size:clamp(2.2rem,6vw,3.2rem); margin:.3rem 0 1rem; line-height:1.1; }
    p { color:var(--suave); font-size:1.1rem; }
    h2 { font-family:"Source Serif 4",Georgia,serif; font-weight:600; margin:3rem 0 1rem; }
    a.cartao { display:block; padding:1.2rem 1.4rem; background:var(--cartao); border:2px solid var(--texto); border-radius:12px;
               box-shadow:3px 3px 0 var(--texto); color:inherit; text-decoration:none; margin-bottom:1rem; }
    a.cartao strong { font-family:"Source Serif 4",Georgia,serif; font-size:1.3rem; }
    a.cartao span { display:block; color:var(--suave); }
  </style>
</head>
<body>
  <main>
    <div class="selo">Sociologia · dados · produtos interativos</div>
    <h1>Vinicius Alvim</h1>
    <p>Doutorando em Sociologia. Pesquisa, análise de dados e desenvolvimento de ferramentas interativas para as ciências sociais.</p>
    <h2>Projetos</h2>
    <a class="cartao" href="anpocs50/">
      <strong>ANPOCS 50 anos</strong>
      <span>Exposição digital do 50º Encontro Anual da ANPOCS.</span>
    </a>
  </main>
</body>
</html>
